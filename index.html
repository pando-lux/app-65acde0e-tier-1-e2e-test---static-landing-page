<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pando Network</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 600px; text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; font-weight: 700; color: #7c6af7; margin-bottom: 1rem; }
    p { font-size: 1.2rem; line-height: 1.7; color: #a0a0a0; margin-bottom: 2rem; }
    .badge { display: inline-block; background: #1a1a2e; border: 1px solid #7c6af7; color: #7c6af7; padding: 0.5rem 1.5rem; border-radius: 2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pando Network</h1>
    <p>The open, decentralized AI network. No tracking. No ads. Every node is equal. Powered by Lux.</p>
    <span class="badge">Deployed via Pando</span>
  </div>
</body>
</html>
